name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            cmd: npm run dist:win
          - os: macos-latest
            label: macOS
            cmd: npm run dist:mac
          - os: ubuntu-latest
            label: Linux / Steam Deck
            cmd: npm run dist:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm

      - run: npm ci

      - name: Read package version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build distributable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.cmd }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: AGI PRIME ${{ steps.ver.outputs.version }}
          body: |
            Desktop installers for Windows, macOS, and Steam Deck.

            Windows builds disable GPU hardware acceleration by default (kernel crash hotfix). Set `AGI_PRIME_ENABLE_GPU=1` to opt in.

            - **Windows:** `AGI-PRIME-${{ steps.ver.outputs.version }}-Windows-Setup-x64.exe` (installer) or portable `.exe`
            - **macOS:** `AGI-PRIME-${{ steps.ver.outputs.version }}-macOS-arm64.dmg` (Apple Silicon) or `…-x64.dmg` (Intel). First open: right-click → Open.
            - **Steam Deck / Linux:** `AGI-PRIME-${{ steps.ver.outputs.version }}-linux-x86_64.AppImage` — add as a non-Steam game, or run `scripts/steamdeck-launch.sh`
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
